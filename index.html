<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAC Science Master - تركيب البروتين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 تحدي الـ 1000 سؤال: تركيب البروتين</h1>
            <p>كن مسترخياً، فكر بذكاء، وحطم البكالوريا!</p>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
        </header>

        <main id="quiz-box">
            <div id="question-container">
                <h2 id="question-text">جاري تحميل الأسئلة...</h2>
                <div id="options-grid" class="options-grid">
                    </div>
            </div>
            <button id="next-btn" class="hidden">السؤال التالي ➡️</button>
        </main>

        <footer>
            <p>Score: <span id="score">0</span> / <span id="total-seen">0</span></p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
