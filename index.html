<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تمارين البكالوريا - علوم</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>📘 تمارين البكالوريا - شعبة العلوم</h1>

    <div class="subject" id="subject"></div>

    <div class="question-box">
        <p id="question">جاري تحميل الأسئلة...</p>
    </div>

    <div class="buttons">
        <button onclick="nextQuestion()">السؤال التالي</button>
        <button onclick="showAnswer()">إظهار الإجابة</button>
    </div>

    <div class="answer" id="answer"></div>

</div>

<script src="script.js"></script>
</body>
</html>
